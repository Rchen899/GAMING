```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroid Attack</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #05050b;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        color: #7dd3ff;
        margin: 20px 0 5px;
    }

    p {
        color: #aaa;
    }

    canvas {
        display: block;
        width: 700px;
        max-width: 95%;
        height: auto;
        margin: 15px auto;
        background: #080b16;
        border: 3px solid #7dd3ff;
        border-radius: 12px;
    }

    .info {
        display: flex;
        justify-content: center;
        gap: 35px;
        font-size: 18px;
    }

    button {
        border: none;
        background: #7dd3ff;
        padding: 12px 22px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin: 6px;
    }

    button:hover {
        transform: scale(1.05);
    }

    a {
        color: #7dd3ff;
        text-decoration: none;
    }
</style>
</head>

<body>

<h1>☄️ Asteroid Attack</h1>
<p>Destroy the asteroids and survive!</p>

<div class="info">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
    <div>Best: <span id="best">0</span></div>
</div>

<canvas id="game" width="700" height="500"></canvas>

<button onclick="restartGame()">🔄 Restart</button>

<p>
    Move: <b>WASD / Arrow Keys</b> &nbsp; | &nbsp;
    Shoot: <b>Space</b>
</p>

<p>
    <a href="../index.html">← Back to GameZone</a>
</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");
const bestText = document.getElementById("best");

let keys = {};
let player;
let bullets;
let asteroids;
let stars;
let score;
let lives;
let gameOver;

let best = Number(localStorage.getItem("asteroidBest")) || 0;
bestText.textContent = best;

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.key === " ") {
        e.preventDefault();

        if (!gameOver) {
            shoot();
        }
    }

    if (gameOver && e.key === "Enter") {
        restartGame();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function restartGame() {
    player = {
        x: canvas.width / 2,
        y: canvas.height - 60,
        size: 24,
        speed: 5
    };

    bullets = [];
    asteroids = [];
    stars = [];

    score = 0;
    lives = 3;
    gameOver = false;

    for (let i = 0; i < 80; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.8 + 0.2
        });
    }

    for (let i = 0; i < 5; i++) {
        spawnAsteroid();
    }

    updateUI();
}

function updateUI() {
    scoreText.textContent = score;
    livesText.textContent = lives;
    bestText.textContent = best;
}

function spawnAsteroid() {
    asteroids.push({
        x: Math.random() * canvas.width,
        y: -40,
        size: 18 + Math.random() * 22,
        speed: 1.5 + Math.random() * 1.5,
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.05
    });
}

function shoot() {
    bullets.push({
        x: player.x,
        y: player.y - 18,
        speed: 8,
        size: 4
    });
}

function update() {
    if (gameOver) return;

    // Player movement
    if (keys["a"] || keys["arrowleft"]) {
        player.x -= player.speed;
    }

    if (keys["d"] || keys["arrowright"]) {
        player.x += player.speed;
    }

    if (keys["w"] || keys["arrowup"]) {
        player.y -= player.speed;
    }

    if (keys["s"] || keys["arrowdown"]) {
        player.y += player.speed;
    }

    // Keep player inside screen
    player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
    player.y = Math.max(30, Math.min(canvas.height - 25, player.y));

    // Bullets
    bullets.forEach(bullet => {
        bullet.y -= bullet.speed;
    });

    bullets = bullets.filter(bullet => bullet.y > -20);

    // Asteroids
    asteroids.forEach(asteroid => {
        asteroid.y += asteroid.speed;
        asteroid.rotation += asteroid.rotationSpeed;
    });

    // Asteroids leaving screen
    asteroids.forEach(asteroid => {
        if (asteroid.y > canvas.height + 50) {
            asteroid.y = -50;
            asteroid.x = Math.random() * canvas.width;
            asteroid.speed += 0.05;

            lives--;

            updateUI();

            if (lives <= 0) {
                endGame();
            }
        }
    });

    // Bullet vs asteroid
    for (let i = asteroids.length - 1; i >= 0; i--) {
        for (let j = bullets.length - 1; j >= 0; j--) {

            const asteroid = asteroids[i];
            const bullet = bullets[j];

            const dx = asteroid.x - bullet.x;
            const dy = asteroid.y - bullet.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < asteroid.size) {
                score += 10;

                asteroid.y = -50;
                asteroid.x = Math.random() * canvas.width;
                asteroid.size = 18 + Math.random() * 22;

                bullets.splice(j, 1);

                if (score > best) {
                    best = score;
                    localStorage.setItem("asteroidBest", best);
                }

                updateUI();
                break;
            }
        }
    }

    // Player vs asteroid
    for (const asteroid of asteroids) {
        const dx = asteroid.x - player.x;
        const dy = asteroid.y - player.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < asteroid.size + player.size / 2) {
            lives--;

            asteroid.y = -60;
            asteroid.x = Math.random() * canvas.width;

            updateUI();

            if (lives <= 0) {
                endGame();
            }

            break;
        }
    }

    // Stars
    stars.forEach(star => {
        star.y += star.speed;

        if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
        }
    });
}

function endGame() {
    gameOver = true;

    if (score > best) {
        best = score;
        localStorage.setItem("asteroidBest", best);
        updateUI();
    }
}

function drawStars() {
    ctx.fillStyle = "white";

    stars.forEach(star => {
        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );
    });
}

function drawPlayer() {
    ctx.save();

    ctx.translate(player.x, player.y);

    ctx.fillStyle = "#7dd3ff";

    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-17, 18);
    ctx.lineTo(0, 10);
    ctx.lineTo(17, 18);
    ctx.closePath();
    ctx.fill();

    // Engine glow
    ctx.fillStyle = "#ffcc66";

    ctx.beginPath();
    ctx.moveTo(-6, 15);
    ctx.lineTo(0, 28);
    ctx.lineTo(6, 15);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawBullets() {
    ctx.fillStyle = "#ffff88";

    bullets.forEach(bullet => {
        ctx.fillRect(
            bullet.x - 2,
            bullet.y - 7,
            4,
            14
        );
    });
}

function drawAsteroids() {
    asteroids.forEach(asteroid => {

        ctx.save();

        ctx.translate(asteroid.x, asteroid.y);
        ctx.rotate(asteroid.rotation);

        ctx.fillStyle = "#777";

        ctx.beginPath();

        const points = 9;

        for (let i = 0; i < points; i++) {
            const angle = (Math.PI * 2 / points) * i;
            const radius = asteroid.size * (
                0.8 + Math.random() * 0.2
            );

            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }

        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#555";

        ctx.beginPath();
        ctx.arc(-7, -4, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(8, 6, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    });
}

function drawGameOver() {
    if (!gameOver) return;

    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.textAlign = "center";

    ctx.fillStyle = "#7dd3ff";
    ctx.font = "bold 46px Arial";
    ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        220
    );

    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.fillText(
        "Score: " + score,
        canvas.width / 2,
        265
    );

    ctx.font = "18px Arial";
    ctx.fillText(
        "Press Enter or Restart",
        canvas.width / 2,
        310
    );
}

function draw() {
    ctx.fillStyle = "#080b16";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawStars();
    drawAsteroids();
    drawBullets();
    drawPlayer();
    drawGameOver();
}

function gameLoop() {
    update();
    draw();

    requestAnimationFrame(gameLoop);
}

restartGame();
gameLoop();
</script>

</body>
</html>
