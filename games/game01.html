<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake | GameZone</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080b14;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

        }

            text-align: center;

            display: flex;
            justify-content: space-between;

            color: #00e5ff;

            background: #111827;

            display: block;

</head>

<body>

    <div class="game-wrapper">

        <div class="top">

            <a href="../index.html" class="back">
                ← GameZone
            </a>

            <h1>🐍 Snake</h1>

            <div style="width: 70px;"></div>

        </div>


        <div class="scores">

            <div class="score-box">

                <div class="score-label">
                    SCORE
                </div>

                <div class="score" id="score">
                    0
                </div>

            </div>


            <div class="score-box">

                <div class="score-label">
                    HIGH SCORE
                </div>

                <div class="score" id="highScore">
                    0
                </div>

            </div>

        </div>


        <canvas id="gameCanvas" width="500" height="500"></canvas>


        <div class="message" id="message">
            Use the arrow keys to move!
        </div>


        <div class="buttons">

            <button id="restart">
                🔄 Restart
            </button>

        </div>


        <!-- MOBILE CONTROLS -->

        <div class="controls">

            <button class="control empty"></button>

            <button
                class="control"
                onclick="changeDirection('up')">
                ▲
            </button>

            <button class="control empty"></button>


            <button
                class="control"
                onclick="changeDirection('left')">
                ◀
            </button>

            <button
                class="control"
                onclick="changeDirection('down')">
                ▼
            </button>

            <button
                class="control"
                onclick="changeDirection('right')">
                ▶
            </button>

        </div>


        <div class="instructions">

            <p>
                Desktop: Arrow Keys or WASD
            </p>

            <p>
                Mobile: Use the buttons
            </p>

        </div>

    </div>


    <script>

        /* =========================
           GAME SETUP
        ========================= */

        const canvas =
            document.getElementById("gameCanvas");

        const ctx =
            canvas.getContext("2d");

        const scoreElement =
            document.getElementById("score");

        const highScoreElement =
            document.getElementById("highScore");

        const messageElement =
            document.getElementById("message");

        const restartButton =
            document.getElementById("restart");


        const gridSize = 25;

        const tileCount =
            canvas.width / gridSize;


        let snake;
        let food;

        let direction;
        let nextDirection;

        let score = 0;

        let highScore =
            Number(localStorage.getItem("snakeHighScore")) || 0;

        let gameRunning = false;

        let gameLoop;


        highScoreElement.textContent =
            highScore;


        /* =========================
           START GAME
        ========================= */

        function startGame() {

            snake = [
                {
                    x: 10,
                    y: 10
                },

                {
                    x: 9,
                    y: 10
                },

                {
                    x: 8,
                    y: 10
                }
            ];


            direction = {
                x: 1,
                y: 0
            };


            nextDirection = {
                x: 1,
                y: 0
            };


            score = 0;

            scoreElement.textContent = score;

            messageElement.textContent =
                "Use the arrow keys to move!";


            createFood();


            clearInterval(gameLoop);

            gameRunning = true;

            gameLoop =
                setInterval(update, 105);

        }


        /* =========================
           CREATE FOOD
        ========================= */

        function createFood() {

            let validPosition = false;

            while (!validPosition) {

                food = {
                    x: Math.floor(
                        Math.random() * tileCount
                    ),

                    y: Math.floor(
                        Math.random() * tileCount
                    )
                };


                validPosition = !snake.some(
                    part =>
                        part.x === food.x &&
                        part.y === food.y
                );

            }

        }


        /* =========================
           UPDATE GAME
        ========================= */

        function update() {

            direction = nextDirection;


            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };


            /* WALL COLLISION */

            if (
                head.x < 0 ||
                head.x >= tileCount ||
                head.y < 0 ||
                head.y >= tileCount
            ) {

                endGame();
                return;

            }


            /* SELF COLLISION */

            if (
                snake.some(
                    part =>
                        part.x === head.x &&
                        part.y === head.y
                )
            ) {

                endGame();
                return;

            }


            snake.unshift(head);


            /* FOOD */

            if (
                head.x === food.x &&
                head.y === food.y
            ) {

                score++;

                scoreElement.textContent =
                    score;


                if (score > highScore) {

                    highScore = score;

                    highScoreElement.textContent =
                        highScore;

                    localStorage.setItem(
                        "snakeHighScore",
                        highScore
                    );

                }


                createFood();

            } else {

                snake.pop();

            }


            draw();

        }


        /* =========================
           DRAW
        ========================= */

        function draw() {

            ctx.fillStyle = "#050810";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* GRID */

            ctx.strokeStyle =
                "rgba(255,255,255,0.025)";

            ctx.lineWidth = 1;


            for (
                let i = 0;
                i <= tileCount;
                i++
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    i * gridSize,
                    0
                );

                ctx.lineTo(
                    i * gridSize,
                    canvas.height
                );

                ctx.stroke();


                ctx.beginPath();

                ctx.moveTo(
                    0,
                    i * gridSize
                );

                ctx.lineTo(
                    canvas.width,
                    i * gridSize
                );

                ctx.stroke();

            }


            /* FOOD */

            ctx.fillStyle = "#a855f7";

            ctx.beginPath();

            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 4,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* SNAKE */

            snake.forEach(
                (part, index) => {

                    if (index === 0) {

                        ctx.fillStyle =
                            "#00e5ff";

                    } else {

                        ctx.fillStyle =
                            "#0891b2";

                    }


                    ctx.fillRect(
                        part.x * gridSize + 2,
                        part.y * gridSize + 2,
                        gridSize - 4,
                        gridSize - 4
                    );

                }
            );

        }


        /* =========================
           CHANGE DIRECTION
        ========================= */

        function changeDirection(newDirection) {

            if (!gameRunning) {
                return;
            }


            if (
                newDirection === "up" &&
                direction.y !== 1
            ) {

                nextDirection = {
                    x: 0,
                    y: -1
                };

            }


            if (
                newDirection === "down" &&
                direction.y !== -1
            ) {

                nextDirection = {
                    x: 0,
                    y: 1
                };

            }


            if (
                newDirection === "left" &&
                direction.x !== 1
            ) {

                nextDirection = {
                    x: -1,
                    y: 0
                };

            }


            if (
                newDirection === "right" &&
                direction.x !== -1
            ) {

                nextDirection = {
                    x: 1,
                    y: 0
                };

            }

        }


        /* =========================
           KEYBOARD
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                const key =
                    event.key.toLowerCase();


                if (
                    key === "arrowup" ||
                    key === "w"
                ) {

                    changeDirection("up");

                }


                else if (
                    key === "arrowdown" ||
                    key === "s"
                ) {

                    changeDirection("down");

                }


                else if (
                    key === "arrowleft" ||
                    key === "a"
                ) {

                    changeDirection("left");

                }


                else if (
                    key === "arrowright" ||
                    key === "d"
                ) {

                    changeDirection("right");

                }

            }
        );


        /* =========================
           GAME OVER
        ========================= */

        function endGame() {

            clearInterval(gameLoop);

            gameRunning = false;

            messageElement.innerHTML =
                "💥 Game Over! Your score: " +
                score +
                ". Press Restart to play again.";

            draw();

        }


        /* =========================
           RESTART
        ========================= */

        restartButton.addEventListener(
            "click",
            startGame
        );


        /* =========================
           START
        ========================= */

        startGame();

    </script>

</body>
</html>
