```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout | GameZone</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #080b14;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game-wrapper {
    width: 100%;
    max-width: 850px;
    text-align: center;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.back {
    color: #00e5ff;
    text-decoration: none;
    font-weight: bold;
}

h1 {
    color: #00e5ff;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 18px;
}

.stat {
    background: #111827;
    border: 1px solid #293449;
    border-radius: 9px;
    padding: 10px 25px;
}

.stat span {
    color: #9ca3af;
    font-size: 12px;
}

.stat strong {
    display: block;
    font-size: 22px;
    margin-top: 4px;
}

canvas {
    display: block;
    width: 100%;
    max-width: 800px;
    height: auto;
    margin: auto;

    background: #050810;
    border: 3px solid #00e5ff;
    border-radius: 10px;

    box-shadow: 0 0 30px rgba(0,229,255,.12);
}

    min-height: 25px;
    margin-top: 15px;
    color: #cbd5e1;
}

button {
    margin-top: 12px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #a855f7;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #9333ea;
}

.controls {
    display: none;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
}

.controls button {
    margin: 0;
    width: 100px;
}

.instructions {
    color: #64748b;
    font-size: 13px;
    margin-top: 18px;
}

@media (max-width: 600px) {
    .controls {
        display: flex;
    }

    .stats {
        gap: 8px;
    }

    .stat {
        padding: 8px 15px;
    }
}
</style>
</head>

<body>

<div class="game-wrapper">

    <div class="top">
        <a href="../index.html" class="back">← GameZone</a>
        <h1>🧱 Breakout</h1>
        <div style="width:70px"></div>
    </div>

    <div class="stats">

        <div class="stat">
            <span>SCORE</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>LIVES</span>
            <strong id="lives">3</strong>
        </div>

    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="message" id="message">
        Use ← → or A/D to move.
    </div>

    <button onclick="restartGame()">🔄 Restart</button>

    <div class="controls">
        <button
            ontouchstart="moveLeft()"
            ontouchend="stopMoving()">
            ◀ LEFT
        </button>

        <button
            ontouchstart="moveRight()"
            ontouchend="stopMoving()">
            RIGHT ▶
        </button>
    </div>

    <div class="instructions">
        Destroy all the blocks to win! 🎮
    </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const messageElement = document.getElementById("message");


/* =========================
   GAME VARIABLES
========================= */

let score = 0;
let lives = 3;
let gameOver = false;

let leftPressed = false;
let rightPressed = false;

const paddle = {
    width: 110,
    height: 14,
    x: canvas.width / 2 - 55,
    y: canvas.height - 35,
    speed: 8
};

const ball = {
    x: canvas.width / 2,
    y: canvas.height - 60,
    radius: 8,
    dx: 4,
    dy: -4
};


/* =========================
   BRICKS
========================= */

const brickRows = 5;
const brickColumns = 10;

const brickWidth = 68;
const brickHeight = 22;

const brickPadding = 8;

const brickStartX = 30;
const brickStartY = 55;

let bricks = [];


function createBricks() {

    bricks = [];

    for (let row = 0; row < brickRows; row++) {

        for (let col = 0; col < brickColumns; col++) {

            bricks.push({
                x:
                    brickStartX +
                    col * (brickWidth + brickPadding),

                y:
                    brickStartY +
                    row * (brickHeight + brickPadding),

                width: brickWidth,
                height: brickHeight,

                alive: true
            });

        }

    }

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", function(event) {

    const key = event.key.toLowerCase();

    if (
        key === "arrowleft" ||
        key === "a"
    ) {
        leftPressed = true;
    }

    if (
        key === "arrowright" ||
        key === "d"
    ) {
        rightPressed = true;
    }

});


document.addEventListener("keyup", function(event) {

    const key = event.key.toLowerCase();

    if (
        key === "arrowleft" ||
        key === "a"
    ) {
        leftPressed = false;
    }

    if (
        key === "arrowright" ||
        key === "d"
    ) {
        rightPressed = false;
    }

});


/* =========================
   MOBILE CONTROLS
========================= */

function moveLeft() {
    leftPressed = true;
}

function moveRight() {
    rightPressed = true;
}

function stopMoving() {
    leftPressed = false;
    rightPressed = false;
}


/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground() {

    ctx.fillStyle = "#050810";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =========================
   DRAW PADDLE
========================= */

function drawPaddle() {

    ctx.fillStyle = "#00e5ff";

    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );

}


/* =========================
   DRAW BALL
========================= */

function drawBall() {

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   DRAW BRICKS
========================= */

function drawBricks() {

    bricks.forEach(function(brick, index) {

        if (!brick.alive) {
            return;
        }

        const row = Math.floor(
            index / brickColumns
        );

        const colors = [
            "#ef4444",
            "#f97316",
            "#facc15",
            "#22c55e",
            "#a855f7"
        ];

        ctx.fillStyle =
            colors[row];

        ctx.fillRect(
            brick.x,
            brick.y,
            brick.width,
            brick.height
        );

    });

}


/* =========================
   MOVE PADDLE
========================= */

function updatePaddle() {

    if (leftPressed) {
        paddle.x -= paddle.speed;
    }

    if (rightPressed) {
        paddle.x += paddle.speed;
    }


    if (paddle.x < 0) {
        paddle.x = 0;
    }


    if (
        paddle.x + paddle.width >
        canvas.width
    ) {
        paddle.x =
            canvas.width - paddle.width;
    }

}


/* =========================
   BALL UPDATE
========================= */

function updateBall() {

    ball.x += ball.dx;
    ball.y += ball.dy;


    /* WALLS */

    if (
        ball.x + ball.radius >=
        canvas.width
    ) {

        ball.x =
            canvas.width - ball.radius;

        ball.dx *= -1;

    }


    if (
        ball.x - ball.radius <= 0
    ) {

        ball.x = ball.radius;

        ball.dx *= -1;

    }


    if (
        ball.y - ball.radius <= 0
    ) {

        ball.y = ball.radius;

        ball.dy *= -1;

    }


    /* PADDLE */

    if (
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <=
            paddle.y + paddle.height &&
        ball.x >= paddle.x &&
        ball.x <=
            paddle.x + paddle.width &&
        ball.dy > 0
    ) {

        ball.y =
            paddle.y - ball.radius;

        ball.dy = -Math.abs(ball.dy);


        const hitPosition =
            (
                ball.x -
                (paddle.x + paddle.width / 2)
            ) /
            (paddle.width / 2);

        ball.dx =
            hitPosition * 6;

    }


    /* BRICKS */

    bricks.forEach(function(brick) {

        if (!brick.alive) {
            return;
        }


        if (
            ball.x + ball.radius > brick.x &&
            ball.x - ball.radius <
                brick.x + brick.width &&
            ball.y + ball.radius > brick.y &&
            ball.y - ball.radius <
                brick.y + brick.height
        ) {

            brick.alive = false;

            ball.dy *= -1;

            score += 10;

            scoreElement.textContent =
                score;

        }

    });


    /* BALL FALLS */

    if (
        ball.y - ball.radius >
        canvas.height
    ) {

        lives--;

        livesElement.textContent =
            lives;


        if (lives <= 0) {

            endGame(false);

        } else {

            resetBall();

        }

    }


    /* WIN */

    const remaining =
        bricks.filter(
            brick => brick.alive
        ).length;


    if (remaining === 0) {

        endGame(true);

    }

}


/* =========================
   RESET BALL
========================= */

function resetBall() {

    ball.x =
        canvas.width / 2;

    ball.y =
        canvas.height - 60;

    ball.dx =
        Math.random() > 0.5 ? 4 : -4;

    ball.dy = -4;

}


/* =========================
   GAME OVER
========================= */

function endGame(won) {

    gameOver = true;

    if (won) {

        messageElement.textContent =
            "🎉 You destroyed every block! You win!";

    } else {

        messageElement.textContent =
            "💥 Game Over! Better luck next time!";

    }

}


/* =========================
   DRAW
========================= */

function draw() {

    drawBackground();

    drawBricks();

    drawPaddle();

    drawBall();

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (!gameOver) {

        updatePaddle();

        updateBall();

    }

    draw();

    requestAnimationFrame(gameLoop);

}


/* =========================
   RESTART
========================= */

function restartGame() {

    score = 0;
    lives = 3;

    scoreElement.textContent = score;
    livesElement.textContent = lives;

    gameOver = false;

    messageElement.textContent =
        "Use ← → or A/D to move.";

    paddle.x =
        canvas.width / 2 -
        paddle.width / 2;

    resetBall();

    createBricks();

}


/* =========================
   START
========================= */

restartGame();

gameLoop();

</script>

</body>
</html>
