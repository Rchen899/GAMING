```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alien Invasion - GameZone</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050611;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .game {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      color: #b84cff;
      margin: 5px;
      text-shadow: 0 0 18px #b84cff;
    }

    p {
      color: #aaa;
      margin: 6px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #111326;
      border: 1px solid #30294d;
      border-radius: 10px;
      padding: 12px;
      margin: 12px 0;
      font-weight: bold;
    }

    canvas {
      width: 100%;
      max-width: 500px;
      display: block;
      margin: auto;
      background: #03040b;
      border: 3px solid #b84cff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(184, 76, 255, 0.3);
    }

    button {
      border: none;
      background: #b84cff;
      color: white;
      font-weight: bold;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      margin: 12px 5px 5px;
    }

    button:hover {
      transform: scale(1.05);
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      color: #b84cff;
      text-decoration: none;
    }

    .controls {
      color: #888;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>👾 ALIEN INVASION</h1>

  <p>Destroy the aliens and survive the invasion!</p>

  <div class="stats">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
    <div>Wave: <span id="wave">1</span></div>
  </div>

  <canvas id="game" width="500" height="600"></canvas>

  <button onclick="restartGame()">🔄 Restart</button>

  <div class="controls">
    ← → or A / D = Move &nbsp; | &nbsp; SPACE = Fire
  </div>

  <a class="back" href="../index.html">← Back to GameZone</a>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let player;
let bullets;
let aliens;
let enemyBullets;
let particles;
let stars;

let score;
let lives;
let wave;

let gameOver;
let keys = {};

let alienDirection;
let alienTimer;
let shootCooldown;

function restartGame() {

  score = 0;
  lives = 3;
  wave = 1;

  gameOver = false;

  bullets = [];
  aliens = [];
  enemyBullets = [];
  particles = [];

  alienDirection = 1;
  alienTimer = 0;
  shootCooldown = 0;

  player = {
    x: W / 2,
    y: H - 70,
    width: 42,
    height: 28,
    speed: 7
  };

  stars = [];

  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + 1,
      speed: Math.random() * 2 + 0.5
    });
  }

  createWave();

  updateStats();
}

function updateStats() {

  document.getElementById("score").textContent = score;
  document.getElementById("lives").textContent = lives;
  document.getElementById("wave").textContent = wave;
}

function createWave() {

  aliens = [];

  const rows = Math.min(
    3 + wave,
    6
  );

  const cols = 7;

  for (let row = 0; row < rows; row++) {

    for (let col = 0; col < cols; col++) {

      aliens.push({
        x: 70 + col * 58,
        y: 60 + row * 42,
        width: 34,
        height: 25,
        alive: true,
        type: row % 3
      });
    }
  }

  alienDirection = 1;
}

function drawStars() {

  ctx.fillStyle = "#03040b";
  ctx.fillRect(0, 0, W, H);

  stars.forEach(star => {

    ctx.fillStyle = "white";

    ctx.fillRect(
      star.x,
      star.y,
      star.size,
      star.size
    );
  });
}

function updateStars() {

  stars.forEach(star => {

    star.y += star.speed;

    if (star.y > H) {
      star.y = 0;
      star.x = Math.random() * W;
    }
  });
}

function drawPlayer() {

  ctx.fillStyle = "#00e5ff";

  ctx.beginPath();

  ctx.moveTo(
    player.x,
    player.y - player.height / 2
  );

  ctx.lineTo(
    player.x - player.width / 2,
    player.y + player.height / 2
  );

  ctx.lineTo(
    player.x + player.width / 2,
    player.y + player.height / 2
  );

  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffffff";

  ctx.fillRect(
    player.x - 4,
    player.y - 5,
    8,
    14
  );
}

function drawAlien(alien) {

  if (!alien.alive) return;

  const colors = [
    "#ff4cff",
    "#65ff4c",
    "#ffcc33"
  ];

  ctx.fillStyle = colors[alien.type];

  // Body
  ctx.fillRect(
    alien.x - alien.width / 2,
    alien.y - 8,
    alien.width,
    18
  );

  // Head
  ctx.beginPath();

  ctx.arc(
    alien.x,
    alien.y - 8,
    13,
    Math.PI,
    0
  );

  ctx.fill();

  // Eyes
  ctx.fillStyle = "#111";

  ctx.fillRect(
    alien.x - 8,
    alien.y - 12,
    5,
    5
  );

  ctx.fillRect(
    alien.x + 3,
    alien.y - 12,
    5,
    5
  );

  // Legs
  ctx.strokeStyle = colors[alien.type];
  ctx.lineWidth = 4;

  ctx.beginPath();

  ctx.moveTo(
    alien.x - 10,
    alien.y + 9
  );

  ctx.lineTo(
    alien.x - 16,
    alien.y + 17
  );

  ctx.moveTo(
    alien.x + 10,
    alien.y + 9
  );

  ctx.lineTo(
    alien.x + 16,
    alien.y + 17
  );

  ctx.stroke();
}

function drawBullet(bullet) {

  ctx.fillStyle = "#00ff88";

  ctx.fillRect(
    bullet.x - 2,
    bullet.y,
    4,
    14
  );
}

function drawEnemyBullet(bullet) {

  ctx.fillStyle = "#ff4455";

  ctx.fillRect(
    bullet.x - 2,
    bullet.y,
    4,
    12
  );
}

function drawParticles() {

  particles.forEach(p => {

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
      p.x,
      p.y,
      4,
      4
    );
  });
}

function createExplosion(x, y) {

  for (let i = 0; i < 15; i++) {

    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 7,
      vy: (Math.random() - 0.5) * 7,
      life: 30
    });
  }
}

function updateParticles() {

  particles.forEach(p => {

    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });

  particles =
    particles.filter(p => p.life > 0);
}

function fire() {

  if (
    shootCooldown > 0 ||
    gameOver
  ) return;

  bullets.push({
    x: player.x,
    y: player.y - 20,
    speed: 10
  });

  shootCooldown = 12;
}

function updateBullets() {

  bullets.forEach(bullet => {
    bullet.y -= bullet.speed;
  });

  bullets =
    bullets.filter(bullet =>
      bullet.y > -20
    );
}

function updateEnemyBullets() {

  enemyBullets.forEach(bullet => {
    bullet.y += 5 + wave * 0.2;
  });

  enemyBullets =
    enemyBullets.filter(bullet =>
      bullet.y < H + 20
    );
}

function alienShoot() {

  const living =
    aliens.filter(alien => alien.alive);

  if (living.length === 0) return;

  const shooter =
    living[
      Math.floor(
        Math.random() * living.length
      )
    ];

  enemyBullets.push({
    x: shooter.x,
    y: shooter.y + 15
  });
}

function collision(a, b) {

  return (
    a.x - a.width / 2 <
      b.x + b.width / 2 &&

    a.x + a.width / 2 >
      b.x - b.width / 2 &&

    a.y - a.height / 2 <
      b.y + b.height / 2 &&

    a.y + a.height / 2 >
      b.y - b.height / 2
  );
}

function updateAliens() {

  alienTimer++;

  if (alienTimer % 45 === 0) {

    let shouldDrop = false;

    aliens.forEach(alien => {

      if (!alien.alive) return;

      alien.x +=
        alienDirection * 10;

      if (
        alien.x > W - 35 ||
        alien.x < 35
      ) {
        shouldDrop = true;
      }
    });

    if (shouldDrop) {

      alienDirection *= -1;

      aliens.forEach(alien => {

        alien.y += 18;
      });
    }
  }

  // Random enemy fire
  if (
    Math.random() <
    0.015 + wave * 0.002
  ) {
    alienShoot();
  }
}

function checkBulletHits() {

  bullets.forEach(bullet => {

    aliens.forEach(alien => {

      if (!alien.alive) return;

      const hit =
        bullet.x >
          alien.x - alien.width / 2 &&

        bullet.x <
          alien.x + alien.width / 2 &&

        bullet.y >
          alien.y - alien.height / 2 &&

        bullet.y <
          alien.y + alien.height / 2;

      if (hit) {

        alien.alive = false;

        bullet.y = -100;

        score += 10;

        createExplosion(
          alien.x,
          alien.y
        );

        updateStats();
      }
    });
  });
}

function checkPlayerHits() {

  enemyBullets.forEach(bullet => {

    if (
      bullet.x >
        player.x - player.width / 2 &&

      bullet.x <
        player.x + player.width / 2 &&

      bullet.y >
        player.y - player.height / 2 &&

      bullet.y <
        player.y + player.height / 2
    ) {

      bullet.y = H + 100;

      lives--;

      createExplosion(
        player.x,
        player.y
      );

      updateStats();

      if (lives <= 0) {
        endGame();
      }
    }
  });
}

function checkAlienReachedBottom() {

  aliens.forEach(alien => {

    if (
      alien.alive &&
      alien.y > H - 130
    ) {
      endGame();
    }
  });
}

function checkWave() {

  const remaining =
    aliens.filter(
      alien => alien.alive
    );

  if (remaining.length === 0) {

    wave++;

    score += 100;

    createWave();

    updateStats();
  }
}

function endGame() {

  gameOver = true;
}

function update() {

  if (gameOver) return;

  updateStars();

  if (
    keys["arrowleft"] ||
    keys["a"]
  ) {
    player.x -= player.speed;
  }

  if (
    keys["arrowright"] ||
    keys["d"]
  ) {
    player.x += player.speed;
  }

  player.x = Math.max(
    30,
    Math.min(
      W - 30,
      player.x
    )
  );

  if (
    keys[" "] ||
    keys["space"]
  ) {
    fire();
  }

  if (shootCooldown > 0) {
    shootCooldown--;
  }

  updateBullets();
  updateEnemyBullets();
  updateAliens();

  checkBulletHits();
  checkPlayerHits();
  checkAlienReachedBottom();
  checkWave();
  updateParticles();
}

function drawGameOver() {

  if (!gameOver) return;

  ctx.fillStyle =
    "rgba(0,0,0,0.75)";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  ctx.textAlign = "center";

  ctx.fillStyle = "#b84cff";
  ctx.font = "bold 42px Arial";

  ctx.fillText(
    "INVASION OVER",
    W / 2,
    H / 2 - 45
  );

  ctx.fillStyle = "white";
  ctx.font = "22px Arial";

  ctx.fillText(
    "Score: " + score,
    W / 2,
    H / 2
  );

  ctx.font = "16px Arial";

  ctx.fillText(
    "Press Restart to try again",
    W / 2,
    H / 2 + 40
  );
}

function draw() {

  drawStars();

  aliens.forEach(drawAlien);

  enemyBullets.forEach(
    drawEnemyBullet
  );

  bullets.forEach(drawBullet);

  drawParticles();

  drawPlayer();

  drawGameOver();
}

document.addEventListener("keydown", e => {

  keys[e.key.toLowerCase()] = true;

  if (e.code === "Space") {
    keys["space"] = true;
    e.preventDefault();
  }
});

document.addEventListener("keyup", e => {

  keys[e.key.toLowerCase()] = false;

  if (e.code === "Space") {
    keys["space"] = false;
  }
});

function loop() {

  update();
  draw();

  requestAnimationFrame(loop);
}

restartGame();
loop();
</script>

</body>
</html>
