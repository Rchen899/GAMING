```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Escape</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #080b12;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        color: #55ff88;
        margin: 20px 0 5px;
    }

    p {
        color: #aaa;
    }

    canvas {
        background: #101722;
        border: 3px solid #55ff88;
        border-radius: 12px;
        max-width: 95%;
        width: 700px;
        height: auto;
        display: block;
        margin: 15px auto;
    }

    .info {
        display: flex;
        justify-content: center;
        gap: 35px;
        font-size: 18px;
        margin: 10px;
    }

    button {
        background: #55ff88;
        border: none;
        padding: 12px 22px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin: 6px;
    }

    button:hover {
        transform: scale(1.05);
    }

    a {
        color: #55ff88;
        text-decoration: none;
    }
</style>
</head>

<body>

<h1>🧟 Zombie Escape</h1>
<p>Move around and avoid the zombies!</p>

<div class="info">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
</div>

<canvas id="game" width="700" height="500"></canvas>

<button onclick="restartGame()">🔄 Restart</button>

<p>
    Controls: <b>WASD</b> or <b>Arrow Keys</b>
</p>

<p>
    <a href="../index.html">← Back to GameZone</a>
</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");

let player;
let zombies;
let score;
let gameOver;
let keys = {};

let best = Number(localStorage.getItem("zombieBest")) || 0;
bestText.textContent = best;

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (
        ["arrowup", "arrowdown", "arrowleft", "arrowright", " "]
        .includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
    }

    if (gameOver && e.key === "Enter") {
        restartGame();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function restartGame() {
    player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        size: 24,
        speed: 4
    };

    zombies = [];

    score = 0;
    gameOver = false;

    scoreText.textContent = score;

    for (let i = 0; i < 4; i++) {
        spawnZombie();
    }
}

function spawnZombie() {
    let side = Math.floor(Math.random() * 4);
    let x, y;

    if (side === 0) {
        x = Math.random() * canvas.width;
        y = -30;
    } else if (side === 1) {
        x = canvas.width + 30;
        y = Math.random() * canvas.height;
    } else if (side === 2) {
        x = Math.random() * canvas.width;
        y = canvas.height + 30;
    } else {
        x = -30;
        y = Math.random() * canvas.height;
    }

    zombies.push({
        x: x,
        y: y,
        size: 22,
        speed: 1 + Math.random() * 0.7
    });
}

function update() {
    if (gameOver) return;

    // Player movement
    if (keys["w"] || keys["arrowup"]) {
        player.y -= player.speed;
    }

    if (keys["s"] || keys["arrowdown"]) {
        player.y += player.speed;
    }

    if (keys["a"] || keys["arrowleft"]) {
        player.x -= player.speed;
    }

    if (keys["d"] || keys["arrowright"]) {
        player.x += player.speed;
    }

    // Keep player inside arena
    player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

    // Move zombies toward player
    zombies.forEach(zombie => {
        const dx = player.x - zombie.x;
        const dy = player.y - zombie.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > 0) {
            zombie.x += (dx / distance) * zombie.speed;
            zombie.y += (dy / distance) * zombie.speed;
        }

        // Collision
        if (distance < player.size + zombie.size) {
            gameOver = true;

            if (score > best) {
                best = score;
                localStorage.setItem("zombieBest", best);
                bestText.textContent = best;
            }
        }
    });

    // Score increases over time
    score += 1;
    scoreText.textContent = score;

    // Add zombies as the score increases
    if (score % 500 === 0) {
        spawnZombie();
    }

    // Slowly increase zombie speed
    zombies.forEach(z => {
        z.speed += 0.0005;
    });
}

function drawBackground() {
    ctx.fillStyle = "#101722";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = "#182330";
    ctx.lineWidth = 1;

    for (let x = 0; x < canvas.width; x += 35) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    for (let y = 0; y < canvas.height; y += 35) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
}

function drawPlayer() {
    // Body
    ctx.fillStyle = "#55ff88";
    ctx.fillRect(
        player.x - player.size / 2,
        player.y - player.size / 2,
        player.size,
        player.size
    );

    // Eyes
    ctx.fillStyle = "#07110b";

    ctx.fillRect(player.x - 7, player.y - 6, 4, 4);
    ctx.fillRect(player.x + 3, player.y - 6, 4, 4);

    // Smile
    ctx.fillRect(player.x - 6, player.y + 5, 12, 3);
}

function drawZombie(zombie) {
    // Head
    ctx.fillStyle = "#a8d96c";

    ctx.beginPath();
    ctx.arc(
        zombie.x,
        zombie.y,
        zombie.size / 2,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Eyes
    ctx.fillStyle = "#111";

    ctx.fillRect(zombie.x - 7, zombie.y - 5, 4, 4);
    ctx.fillRect(zombie.x + 3, zombie.y - 5, 4, 4);

    // Mouth
    ctx.fillRect(zombie.x - 7, zombie.y + 5, 14, 3);
}

function draw() {
    drawBackground();

    zombies.forEach(drawZombie);
    drawPlayer();

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#55ff88";
        ctx.font = "bold 48px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, 220);

        ctx.fillStyle = "white";
        ctx.font = "24px Arial";
        ctx.fillText(
            "Score: " + score,
            canvas.width / 2,
            265
        );

        ctx.font = "18px Arial";
        ctx.fillText(
            "Press Enter or Restart",
            canvas.width / 2,
            310
        );
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

restartGame();
gameLoop();
</script>

</body>
</html>
