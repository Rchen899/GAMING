```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nitro Drift - GameZone</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #070914;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .game {
      text-align: center;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      color: #00e5ff;
      margin: 5px 0;
      text-shadow: 0 0 15px #00e5ff;
    }

    p {
      color: #aaa;
      margin: 5px 0 12px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #111629;
      border: 1px solid #27304d;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    canvas {
      width: 100%;
      max-width: 420px;
      height: auto;
      border: 3px solid #00e5ff;
      border-radius: 12px;
      background: #111;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
      display: block;
      margin: auto;
    }

    button {
      background: #00e5ff;
      color: #001018;
      border: none;
      padding: 12px 22px;
      margin: 12px 5px 5px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      color: #00e5ff;
      text-decoration: none;
    }

    .controls {
      margin-top: 12px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>🏎️ NITRO DRIFT</h1>

  <p>Dodge cars, collect nitro and survive!</p>

  <div class="stats">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
    <div>Nitro: <span id="nitro">0</span></div>
  </div>

  <canvas id="game" width="420" height="600"></canvas>

  <button onclick="restartGame()">🔄 Restart</button>

  <div class="controls">
    ← → or A / D = Move &nbsp; | &nbsp; SPACE = Nitro
  </div>

  <a class="back" href="../index.html">← Back to GameZone</a>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let player;
let enemies;
let boosts;
let particles;

let score;
let best = Number(localStorage.getItem("nitroBest")) || 0;
let nitro;
let speed;
let gameOver;
let started;

let keys = {};

document.getElementById("best").textContent = best;

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (e.code === "Space") {
    e.preventDefault();

    if (!started || gameOver) {
      restartGame();
    }
  }
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function restartGame() {

  player = {
    x: W / 2 - 22,
    y: H - 100,
    width: 44,
    height: 70
  };

  enemies = [];
  boosts = [];
  particles = [];

  score = 0;
  nitro = 0;
  speed = 4;
  gameOver = false;
  started = true;

  updateStats();
}

function updateStats() {
  document.getElementById("score").textContent =
    Math.floor(score);

  document.getElementById("best").textContent =
    best;

  document.getElementById("nitro").textContent =
    nitro;
}

function drawRoad() {

  ctx.fillStyle = "#151515";
  ctx.fillRect(0, 0, W, H);

  // Grass
  ctx.fillStyle = "#12351b";
  ctx.fillRect(0, 0, 35, H);
  ctx.fillRect(W - 35, 0, 35, H);

  // Road
  ctx.fillStyle = "#292929";
  ctx.fillRect(35, 0, W - 70, H);

  // Road edges
  ctx.fillStyle = "#eeeeee";
  ctx.fillRect(38, 0, 5, H);
  ctx.fillRect(W - 43, 0, 5, H);

  // Moving lane lines
  ctx.strokeStyle = "#dddddd";
  ctx.lineWidth = 4;
  ctx.setLineDash([35, 30]);

  let offset = (score * 3) % 65;

  for (let x = 140; x < W - 100; x += 140) {
    ctx.beginPath();
    ctx.moveTo(x, -65 + offset);
    ctx.lineTo(x, H + 65);
    ctx.stroke();
  }

  ctx.setLineDash([]);
}

function drawPlayer() {

  // Nitro flame
  if (keys[" "] && nitro > 0) {

    ctx.fillStyle = "#ffcc00";

    ctx.beginPath();
    ctx.moveTo(player.x + 10, player.y + player.height);
    ctx.lineTo(player.x + 22, player.y + player.height + 30);
    ctx.lineTo(player.x + 34, player.y + player.height);
    ctx.fill();
  }

  // Car body
  ctx.fillStyle = "#00e5ff";
  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );

  // Windshield
  ctx.fillStyle = "#07121c";
  ctx.fillRect(
    player.x + 8,
    player.y + 10,
    player.width - 16,
    18
  );

  // Stripe
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(
    player.x + 18,
    player.y,
    8,
    player.height
  );

  // Wheels
  ctx.fillStyle = "#050505";

  ctx.fillRect(
    player.x - 5,
    player.y + 10,
    7,
    18
  );

  ctx.fillRect(
    player.x + player.width - 2,
    player.y + 10,
    7,
    18
  );

  ctx.fillRect(
    player.x - 5,
    player.y + 43,
    7,
    18
  );

  ctx.fillRect(
    player.x + player.width - 2,
    player.y + 43,
    7,
    18
  );
}

function drawEnemy(enemy) {

  ctx.fillStyle = enemy.color;

  ctx.fillRect(
    enemy.x,
    enemy.y,
    enemy.width,
    enemy.height
  );

  ctx.fillStyle = "#111";

  ctx.fillRect(
    enemy.x + 7,
    enemy.y + 10,
    enemy.width - 14,
    16
  );

  ctx.fillStyle = "#ff3333";

  ctx.fillRect(
    enemy.x + 7,
    enemy.y + enemy.height - 12,
    8,
    5
  );

  ctx.fillRect(
    enemy.x + enemy.width - 15,
    enemy.y + enemy.height - 12,
    8,
    5
  );
}

function drawBoost(boost) {

  ctx.fillStyle = "#ffe600";

  ctx.beginPath();
  ctx.arc(
    boost.x,
    boost.y,
    13,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.fillStyle = "#ff8c00";
  ctx.font = "bold 17px Arial";
  ctx.textAlign = "center";
  ctx.fillText("N", boost.x, boost.y + 6);
}

function spawnEnemy() {

  const lanes = [
    80,
    185,
    290
  ];

  const lane =
    lanes[Math.floor(Math.random() * lanes.length)];

  enemies.push({
    x: lane,
    y: -90,
    width: 44,
    height: 70,
    color: [
      "#ff3344",
      "#9b59ff",
      "#ff8c00",
      "#00ff66"
    ][Math.floor(Math.random() * 4)]
  });
}

function spawnBoost() {

  const lanes = [
    100,
    205,
    310
  ];

  boosts.push({
    x: lanes[Math.floor(Math.random() * lanes.length)],
    y: -30,
    radius: 13
  });
}

function collision(a, b) {

  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

function boostCollision(boost) {

  return (
    player.x < boost.x + 13 &&
    player.x + player.width > boost.x - 13 &&
    player.y < boost.y + 13 &&
    player.y + player.height > boost.y - 13
  );
}

function createParticles(x, y) {

  for (let i = 0; i < 18; i++) {

    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 30
    });
  }
}

function drawParticles() {

  particles.forEach(p => {

    ctx.fillStyle = "#00e5ff";

    ctx.fillRect(
      p.x,
      p.y,
      4,
      4
    );
  });
}

function updateParticles() {

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });

  particles =
    particles.filter(p => p.life > 0);
}

function update() {

  if (gameOver) return;

  // Movement
  if (
    keys["arrowleft"] ||
    keys["a"]
  ) {
    player.x -= 6;
  }

  if (
    keys["arrowright"] ||
    keys["d"]
  ) {
    player.x += 6;
  }

  // Nitro
  if (
    keys[" "] &&
    nitro > 0
  ) {
    speed = 9;
    nitro -= 0.25;
  } else {
    speed =
      4 + Math.min(score / 500, 5);
  }

  // Keep player on road
  player.x = Math.max(
    48,
    Math.min(
      W - 48 - player.width,
      player.x
    )
  );

  // Score
  score += 0.15;

  // Spawn enemies
  if (
    Math.random() <
    0.018 + score / 50000
  ) {
    spawnEnemy();
  }

  // Spawn boosts
  if (
    Math.random() < 0.004 &&
    nitro < 100
  ) {
    spawnBoost();
  }

  // Enemies
  enemies.forEach(enemy => {

    enemy.y += speed;

    if (collision(player, enemy)) {
      endGame();
    }
  });

  enemies =
    enemies.filter(enemy =>
      enemy.y < H + 100
    );

  // Boosts
  boosts.forEach(boost => {

    boost.y += speed;

    if (boostCollision(boost)) {

      nitro = Math.min(
        100,
        nitro + 25
      );

      createParticles(
        boost.x,
        boost.y
      );

      boost.collected = true;
    }
  });

  boosts =
    boosts.filter(boost =>
      boost.y < H + 50 &&
      !boost.collected
    );

  updateParticles();
  updateStats();
}

function endGame() {

  gameOver = true;

  if (Math.floor(score) > best) {

    best = Math.floor(score);

    localStorage.setItem(
      "nitroBest",
      best
    );
  }

  updateStats();
}

function drawGameOver() {

  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  ctx.textAlign = "center";

  ctx.fillStyle = "#00e5ff";
  ctx.font = "bold 40px Arial";

  ctx.fillText(
    "CRASHED!",
    W / 2,
    H / 2 - 30
  );

  ctx.fillStyle = "white";
  ctx.font = "bold 22px Arial";

  ctx.fillText(
    "Score: " + Math.floor(score),
    W / 2,
    H / 2 + 15
  );

  ctx.font = "16px Arial";

  ctx.fillText(
    "Press SPACE or Restart",
    W / 2,
    H / 2 + 55
  );
}

function draw() {

  drawRoad();

  boosts.forEach(drawBoost);
  enemies.forEach(drawEnemy);

  drawParticles();
  drawPlayer();

  if (gameOver) {
    drawGameOver();
  }
}

function loop() {

  update();
  draw();

  requestAnimationFrame(loop);
}

restartGame();
loop();
</script>

</body>
</html>
