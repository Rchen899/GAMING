```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitro Drift - GameZone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #14213d, #070914 55%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
}

.game {
    width: 100%;
    max-width: 520px;
    text-align: center;
}

h1 {
    margin: 4px 0;
    color: #00e5ff;
    text-shadow:
        0 0 8px #00e5ff,
        0 0 25px #00e5ff;
    font-size: 30px;
}

.subtitle {
    color: #aaa;
    margin: 4px 0 10px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    background: #111629;
    border: 1px solid #27304d;
    border-radius: 12px;
    padding: 9px;
    margin-bottom: 9px;
    font-size: 13px;
    font-weight: bold;
}

.stat span {
    display: block;
    color: #00e5ff;
    font-size: 17px;
    margin-top: 3px;
}

canvas {
    width: 100%;
    max-width: 420px;
    height: auto;
    display: block;
    margin: auto;
    background: #111;
    border: 3px solid #00e5ff;
    border-radius: 14px;
    box-shadow:
        0 0 15px rgba(0,229,255,.35),
        0 0 40px rgba(0,229,255,.12);
}

button {
    background: #00e5ff;
    color: #001018;
    border: none;
    padding: 11px 20px;
    margin: 10px 4px 5px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    transition: .15s;
}

button:hover {
    transform: scale(1.05);
}

.controls {
    color: #888;

}

    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
}

.touch button {
    width: 75px;
    height: 48px;
    margin: 0;
    font-size: 20px;
    background: #17213b;
    color: white;
    border: 1px solid #00e5ff;
}

.touch button.nitro {
    width: 110px;
    background: #ff8c00;

}

    display: inline-block;

    color: #00e5ff;

@media (max-width: 450px) {
    h1 {
        font-size: 25px;

    .stats {

</head>

<body>

<div class="game">

<h1>🏎️ NITRO DRIFT</h1>

<div class="subtitle">
Dodge traffic • Collect coins • Blast your nitro!
</div>

<div class="stats">

    <div class="stat">
        SCORE
        <span id="score">0</span>
    </div>

    <div class="stat">
        COINS
        <span id="coins">0</span>
    </div>

    <div class="stat">
        ❤️ LIVES
        <span id="lives">3</span>
    </div>

    <div class="stat">
        ⚡ NITRO
        <span id="nitro">50</span>
    </div>

</div>

<canvas id="game" width="420" height="600"></canvas>

<button onclick="restartGame()">🔄 Restart</button>

<div class="controls">
← → or A / D = Drive &nbsp; | &nbsp; SPACE = Nitro
</div>

<div class="touch">

    <button
        onpointerdown="leftPressed=true"
        onpointerup="leftPressed=false"
        onpointerleave="leftPressed=false">
        ◀
    </button>

    <button
        class="nitro"
        onpointerdown="nitroPressed=true"
        onpointerup="nitroPressed=false"
        onpointerleave="nitroPressed=false">
        ⚡ NITRO
    </button>

    <button
        onpointerdown="rightPressed=true"
        onpointerup="rightPressed=false"
        onpointerleave="rightPressed=false">
        ▶
    </button>

</div>

<a class="back" href="../index.html">← Back to GameZone</a>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let player;
let enemies;
let coinsList;
let nitroPacks;
let particles;
let roadLights;

let score = 0;
let coins = 0;
let lives = 3;
let nitro = 50;

let speed = 4;
let gameOver = false;
let started = false;

let keys = {};

let leftPressed = false;
let rightPressed = false;
let nitroPressed = false;

let best = 0;

try {
    best = Number(localStorage.getItem("nitroBest")) || 0;
} catch (e) {
    best = 0;
}

document.addEventListener("keydown", function(e) {

    keys[e.key.toLowerCase()] = true;

    if (
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight" ||
        e.code === "Space"
    ) {
        e.preventDefault();
    }

    if (e.code === "Space") {

        if (!started || gameOver) {
            restartGame();
        }
    }
});

document.addEventListener("keyup", function(e) {
    keys[e.key.toLowerCase()] = false;
});


function restartGame() {

    player = {
        x: W / 2 - 22,
        y: H - 105,
        width: 44,
        height: 72,
        invincible: 0
    };

    enemies = [];
    coinsList = [];
    nitroPacks = [];
    particles = [];

    roadLights = [];

    score = 0;
    coins = 0;
    lives = 3;
    nitro = 50;

    speed = 4;

    gameOver = false;
    started = true;

    createRoadLights();

    updateStats();
}


function createRoadLights() {

    roadLights = [];

    for (let y = 0; y < H + 100; y += 80) {

        roadLights.push({
            x: 20,
            y: y
        });

        roadLights.push({
            x: W - 20,
            y: y - 40
        });
    }
}


function updateStats() {

    document.getElementById("score").textContent =
        Math.floor(score);

    document.getElementById("coins").textContent =
        coins;

    document.getElementById("lives").textContent =
        lives;

    document.getElementById("nitro").textContent =
        Math.floor(nitro);
}


function drawRoad() {

    // Grass
    ctx.fillStyle = "#103619";
    ctx.fillRect(0, 0, W, H);

    // Grass stripes
    ctx.fillStyle = "#16491f";

    for (let y = 0; y < H; y += 50) {
        ctx.fillRect(0, y, 35, 25);
        ctx.fillRect(W - 35, y, 35, 25);
    }

    // Road
    ctx.fillStyle = "#292929";
    ctx.fillRect(35, 0, W - 70, H);

    // Road edges
    ctx.fillStyle = "#eeeeee";

    ctx.fillRect(38, 0, 5, H);
    ctx.fillRect(W - 43, 0, 5, H);

    // Lane lines
    ctx.strokeStyle = "#ddd";
    ctx.lineWidth = 4;
    ctx.setLineDash([35, 30]);

    let offset = (score * 4) % 65;

    for (let x = 140; x < W - 100; x += 140) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            -65 + offset
        );

        ctx.lineTo(
            x,
            H + 65
        );

        ctx.stroke();
    }

    ctx.setLineDash([]);

    // Road lights
    for (let light of roadLights) {

        ctx.fillStyle = "#ffe600";

        ctx.beginPath();

        ctx.arc(
            light.x,
            light.y,
            5,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle =
            "rgba(255,230,0,.18)";

        ctx.beginPath();

        ctx.arc(
            light.x,
            light.y,
            13,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


function drawPlayer() {

    if (player.invincible > 0 &&
        Math.floor(player.invincible / 5) % 2 === 0) {
        return;
    }

    // Nitro flame
    if (
        (keys[" "] || nitroPressed) &&
        nitro > 0
    ) {

        ctx.fillStyle = "#ffcc00";

        ctx.beginPath();

        ctx.moveTo(
            player.x + 9,
            player.y + player.height
        );

        ctx.lineTo(
            player.x + 22,
            player.y + player.height + 34
        );

        ctx.lineTo(
            player.x + 35,
            player.y + player.height
        );

        ctx.fill();

        ctx.fillStyle = "#ff5a00";

        ctx.beginPath();

        ctx.moveTo(
            player.x + 15,
            player.y + player.height
        );

        ctx.lineTo(
            player.x + 22,
            player.y + player.height + 22
        );

        ctx.lineTo(
            player.x + 29,
            player.y + player.height
        );

        ctx.fill();
    }

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,.35)";

    ctx.fillRect(
        player.x + 4,
        player.y + 5,
        player.width,
        player.height
    );

    // Car body
    ctx.fillStyle = "#00e5ff";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    // Hood
    ctx.fillStyle = "#08bcd4";

    ctx.fillRect(
        player.x + 4,
        player.y + 30,
        player.width - 8,
        28
    );

    // Window
    ctx.fillStyle = "#07121c";

    ctx.fillRect(
        player.x + 8,
        player.y + 9,
        player.width - 16,
        20
    );

    // White stripe
    ctx.fillStyle = "white";

    ctx.fillRect(
        player.x + 18,
        player.y,
        8,
        player.height
    );

    // Wheels
    ctx.fillStyle = "#050505";

    ctx.fillRect(
        player.x - 5,
        player.y + 10,
        7,
        20
    );

    ctx.fillRect(
        player.x + player.width - 2,
        player.y + 10,
        7,
        20
    );

    ctx.fillRect(
        player.x - 5,
        player.y + 43,
        7,
        20
    );

    ctx.fillRect(
        player.x + player.width - 2,
        player.y + 43,
        7,
        20
    );

    // Headlights
    ctx.fillStyle = "#ffffcc";

    ctx.fillRect(
        player.x + 5,
        player.y + 3,
        9,
        5
    );

    ctx.fillRect(
        player.x + player.width - 14,
        player.y + 3,
        9,
        5
    );
}


function drawEnemy(enemy) {

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,.3)";

    ctx.fillRect(
        enemy.x + 4,
        enemy.y + 5,
        enemy.width,
        enemy.height
    );

    // Body
    ctx.fillStyle = enemy.color;

    ctx.fillRect(
        enemy.x,
        enemy.y,
        enemy.width,
        enemy.height
    );

    // Window
    ctx.fillStyle = "#111";

    ctx.fillRect(
        enemy.x + 7,
        enemy.y + 10,
        enemy.width - 14,
        18
    );

    // Wheels
    ctx.fillStyle = "#050505";

    ctx.fillRect(
        enemy.x - 4,
        enemy.y + 12,
        7,
        18
    );

    ctx.fillRect(
        enemy.x + enemy.width - 3,
        enemy.y + 12,
        7,
        18
    );

    ctx.fillRect(
        enemy.x - 4,
        enemy.y + 43,
        7,
        18
    );

    ctx.fillRect(
        enemy.x + enemy.width - 3,
        enemy.y + 43,
        7,
        18
    );

    // Lights
    ctx.fillStyle = "#ff3333";

    ctx.fillRect(
        enemy.x + 6,
        enemy.y + enemy.height - 10,
        8,
        5
    );

    ctx.fillRect(
        enemy.x + enemy.width - 14,
        enemy.y + enemy.height - 10,
        8,
        5
    );
}


function drawCoin(coin) {

    ctx.fillStyle = "#ffcc00";

    ctx.beginPath();

    ctx.arc(
        coin.x,
        coin.y,
        11,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = "#fff3a0";
    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.fillStyle = "#ff8c00";
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "$",
        coin.x,
        coin.y + 5
    );
}


function drawNitroPack(pack) {

    ctx.fillStyle = "#ff8c00";

    ctx.fillRect(
        pack.x - 13,
        pack.y - 15,
        26,
        30
    );

    ctx.fillStyle = "#111";

    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "N",
        pack.x,
        pack.y + 6
    );

    ctx.strokeStyle = "#ffe600";
    ctx.lineWidth = 2;

    ctx.strokeRect(
        pack.x - 13,
        pack.y - 15,
        26,
        30
    );
}


function spawnEnemy() {

    const lanes = [80, 185, 290];

    const lane =
        lanes[
            Math.floor(
                Math.random() * lanes.length
            )
        ];

    enemies.push({

        x: lane,

        y: -100,

        width: 44,

        height: 72,

        color: [
            "#ff3344",
            "#9b59ff",
            "#ff8c00",
            "#00d66b"
        ][
            Math.floor(
                Math.random() * 4
            )
        ]
    });
}


function spawnCoin() {

    const lanes = [100, 205, 310];

    coinsList.push({

        x: lanes[
            Math.floor(
                Math.random() * lanes.length
            )
        ],

        y: -30,

        radius: 11
    });
}


function spawnNitro() {

    const lanes = [100, 205, 310];

    nitroPacks.push({

        x: lanes[
            Math.floor(
                Math.random() * lanes.length
            )
        ],

        y: -30
    });
}


function collision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


function coinCollision(coin) {

    return (
        player.x < coin.x + 11 &&
        player.x + player.width >
            coin.x - 11 &&
        player.y < coin.y + 11 &&
        player.y + player.height >
            coin.y - 11
    );
}


function nitroCollision(pack) {

    return (
        player.x < pack.x + 13 &&
        player.x + player.width >
            pack.x - 13 &&
        player.y < pack.y + 15 &&
        player.y + player.height >
            pack.y - 15
    );
}


function createParticles(x, y) {

    for (let i = 0; i < 25; i++) {

        particles.push({

            x: x,

            y: y,

            vx:
                (Math.random() - .5) * 8,

            vy:
                (Math.random() - .5) * 8,

            life: 35,

            size:
                Math.random() * 5 + 2
        });
    }
}


function updateParticles() {

    for (let p of particles) {

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

        p.vy += .08;
    }

    particles =
        particles.filter(
            p => p.life > 0
        );
}


function drawParticles() {

    for (let p of particles) {

        ctx.globalAlpha =
            p.life / 35;

        ctx.fillStyle =
            p.life % 2 === 0
            ? "#ffcc00"
            : "#ff4d00";

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha = 1;
}


function updateRoadLights() {

    for (let light of roadLights) {

        light.y += speed;

        if (light.y > H + 30) {
            light.y = -30;
        }
    }
}


function update() {

    if (!started || gameOver) {
        return;
    }

    // Movement
    if (
        keys["arrowleft"] ||
        keys["a"] ||
        leftPressed
    ) {
        player.x -= 7;
    }

    if (
        keys["arrowright"] ||
        keys["d"] ||
        rightPressed
    ) {
        player.x += 7;
    }

    // Nitro
    let usingNitro =
        (keys[" "] || nitroPressed) &&
        nitro > 0;

    if (usingNitro) {

        speed = 9;

        nitro -= .45;

    } else {

        speed =
            4 +
            Math.min(
                score / 600,
                6
            );
    }

    if (nitro < 0) {
        nitro = 0;
    }

    // Keep player on road
    player.x =
        Math.max(
            48,
            Math.min(
                W - 48 - player.width,
                player.x
            )
        );

    if (player.invincible > 0) {
        player.invincible--;
    }

    // Score
    score += .18;

    // Enemy spawning
    let enemyChance =
        .014 +
        Math.min(score / 60000, .018);

    if (Math.random() < enemyChance) {
        spawnEnemy();
    }

    // Coin spawning
    if (Math.random() < .009) {
        spawnCoin();
    }

    // Nitro spawning
    if (
        Math.random() < .004 &&
        nitro < 85
    ) {
        spawnNitro();
    }

    // Enemies
    for (let enemy of enemies) {

        enemy.y += speed;

        if (
            player.invincible <= 0 &&
            collision(player, enemy)
        ) {

            lives--;

            player.invincible = 90;

            createParticles(
                player.x + player.width / 2,
                player.y + player.height / 2
            );

            enemy.y = H + 200;

            if (lives <= 0) {
                endGame();
            }
        }
    }

    enemies =
        enemies.filter(
            enemy =>
                enemy.y < H + 120
        );

    // Coins
    for (let coin of coinsList) {

        coin.y += speed;

        if (coinCollision(coin)) {

            coins++;

            score += 25;

            createParticles(
                coin.x,
                coin.y
            );

            coin.collected = true;
        }
    }

    coinsList =
        coinsList.filter(
            coin =>
                coin.y < H + 40 &&
                !coin.collected
        );

    // Nitro pickups
    for (let pack of nitroPacks) {

        pack.y += speed;

        if (nitroCollision(pack)) {

            nitro =
                Math.min(
                    100,
                    nitro + 30
                );

            score += 15;

            createParticles(
                pack.x,
                pack.y
            );

            pack.collected = true;
        }
    }

    nitroPacks =
        nitroPacks.filter(
            pack =>
                pack.y < H + 50 &&
                !pack.collected
        );

    updateRoadLights();
    updateParticles();

    updateStats();
}


function endGame() {

    gameOver = true;

    let finalScore =
        Math.floor(score);

    if (finalScore > best) {

        best = finalScore;

        try {

            localStorage.setItem(
                "nitroBest",
                best
            );

        } catch (e) {}
    }

    updateStats();
}


function drawStartScreen() {

    ctx.fillStyle =
        "rgba(0,0,0,.72)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.textAlign = "center";

    ctx.fillStyle = "#00e5ff";

    ctx.font =
        "bold 40px Arial";

    ctx.fillText(
        "NITRO DRIFT",
        W / 2,
        H / 2 - 80
    );

    ctx.fillStyle = "white";

    ctx.font =
        "18px Arial";

    ctx.fillText(
        "Dodge traffic",
        W / 2,
        H / 2 - 25
    );

    ctx.fillText(
        "Collect coins",
        W / 2,
        H / 2 + 5
    );

    ctx.fillText(
        "Grab NITRO",
        W / 2,
        H / 2 + 35
    );

    ctx.fillStyle = "#ffcc00";

    ctx.font =
        "bold 18px Arial";

    ctx.fillText(
        "Press SPACE to start",
        W / 2,
        H / 2 + 90
    );
}


function drawGameOver() {

    ctx.fillStyle =
        "rgba(0,0,0,.78)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.textAlign = "center";

    ctx.fillStyle = "#ff4050";

    ctx.font =
        "bold 44px Arial";

    ctx.fillText(
        "GAME OVER",
        W / 2,
        H / 2 - 60
    );

    ctx.fillStyle = "white";

    ctx.font =
        "bold 22px Arial";

    ctx.fillText(
        "Score: " + Math.floor(score),
        W / 2,
        H / 2 - 15
    );

    ctx.fillText(
        "Coins: " + coins,
        W / 2,
        H / 2 + 20
    );

    ctx.fillStyle = "#00e5ff";

    ctx.font =
        "16px Arial";

    ctx.fillText(
        "Press SPACE or Restart",
        W / 2,
        H / 2 + 65
    );
}


function draw() {

    drawRoad();

    for (let coin of coinsList) {
        drawCoin(coin);
    }

    for (let pack of nitroPacks) {
        drawNitroPack(pack);
    }

    for (let enemy of enemies) {
        drawEnemy(enemy);
    }

    drawParticles();

    drawPlayer();

    if (!started) {
        drawStartScreen();
    }

    if (gameOver) {
        drawGameOver();
    }
}


function loop() {

    update();

    draw();

    requestAnimationFrame(loop);
}


restartGame();

// Show start screen initially
started = false;

loop();

</script>

</body>
</html>
```
